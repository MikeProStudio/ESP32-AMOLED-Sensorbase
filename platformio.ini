[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Speicher-Einstellungen für PSRAM (WICHTIG!)
board_build.arduino.memory_type = qio_opi 
board_build.f_cpu = 240000000L

build_flags = 
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; WICHTIG: Farben direkt tauschen für SPI/QSPI Displays
    -D LV_COLOR_16_SWAP=1
    -D LV_FONT_MONTSERRAT_32=1
    -D LV_FONT_MONTSERRAT_28=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_40=1
    -D LV_FONT_DEFAULT=&lv_font_montserrat_14
    -D LV_USE_SJPG=1
    -D LV_USE_JPG=1
    -D LV_USE_QRCODE=1
    -D TFT_WIDTH=536
    -D TFT_HEIGHT=240
    -I include
    -I src
    -D LV_MEM_CUSTOM=1        ; Nutzt das echte malloc (Systemspeicher)
    -D LV_MEM_SIZE=128U*1024U ; Erhöht den internen Speicher vorsichtshalber

board_build.filesystem = littlefs

lib_deps =
    lvgl/lvgl @ 8.3.9
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0
    bodmer/TJpg_Decoder @ ^1.1.0
    bodmer/TFT_eSPI @ ^2.5.33
    # Direkte Links um den "UnknownPackageError" zu umgehen:
    https://github.com/Sensirion/arduino-core.git
    https://github.com/Sensirion/arduino-i2c-sgp41.git
    https://github.com/Sensirion/arduino-gas-index-algorithm.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    ESP32 HTTPClient
    h2zero/NimBLE-Arduino @ ^1.4.1
